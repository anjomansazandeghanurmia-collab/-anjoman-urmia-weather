<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
هواشناسی زنده انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:tahoma,Arial;
background:#eef6fb;
color:#333;

}


.header{

background:linear-gradient(90deg,#0d47a1,#1976d2);
color:white;
padding:18px;
text-align:center;
font-size:16px;
font-weight:bold;

}



.container{

max-width:1100px;
margin:auto;
padding:20px;

}



.card{

background:white;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.title{

font-size:22px;
color:#0d47a1;
text-align:center;
margin-bottom:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;

}



.weather-box{

background:#f8fbff;
border:1px solid #dbeaf5;
border-radius:18px;
padding:20px;
text-align:center;

}



.icon{

font-size:35px;

}



.label{

margin-top:10px;
color:#555;

}



.value{

font-size:28px;
font-weight:bold;
color:#0d47a1;
margin-top:10px;

}



.aqi{

color:#008000;

}



.forecast{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;

}



.day{

background:#f8fbff;
border-radius:15px;
padding:15px;
border:1px solid #dcebf7;
line-height:2;
text-align:center;

}



.gold{

color:#c79b2b;

}



.loading{

text-align:center;
color:#1976d2;

}



.footer{

text-align:center;
font-size:12px;
color:#777;
padding:15px;

}



</style>

</head>


<body>


<div class="header">

انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه

<br>

<span style="font-size:13px">
سامانه هواشناسی زنده
</span>

</div>



<div class="container">


<div class="card">

<div class="title">
🌤 وضعیت لحظه‌ای هوا - ارومیه
</div>


<div class="grid">


<div class="weather-box">

<div class="icon">🌡</div>

<div class="label">
دما
</div>

<div class="value" id="temp">
--
</div>

</div>



<div class="weather-box">

<div class="icon">💧</div>

<div class="label">
رطوبت
</div>

<div class="value" id="humidity">
--
</div>

</div>



<div class="weather-box">

<div class="icon">💨</div>

<div class="label">
سرعت باد
</div>

<div class="value" id="wind">
--
</div>

</div>



<div class="weather-box">

<div class="icon">🌫</div>

<div class="label">
شاخص آلودگی هوا
</div>

<div class="value aqi" id="aqi">
--
</div>

</div>


</div>

</div>



<div class="card">


<div class="title">

📅 پیش‌بینی روزهای آینده

</div>


<div id="forecast" class="forecast loading">

در حال دریافت اطلاعات آنلاین...

</div>


</div>
<script>

const lat = 37.5527;
const lon = 45.0761;


// دریافت هواشناسی زنده

async function getWeather(){

try{


let url =
`https://api.open-meteo.com/v1/forecast?
latitude=${lat}
&longitude=${lon}
&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code
&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,rain_sum,snowfall_sum,wind_speed_10m_max
&timezone=Asia%2FTehran`;


url=url.replace(/\s/g,'');



let response=await fetch(url);

let data=await response.json();



document.getElementById("temp").innerHTML =
data.current.temperature_2m+" °C";


document.getElementById("humidity").innerHTML =
data.current.relative_humidity_2m+" %";


document.getElementById("wind").innerHTML =
data.current.wind_speed_10m+" km/h";



// آلودگی ساده آنلاین

getAir();



let html="";



for(let i=0;i<7;i++){


let rain=data.daily.rain_sum[i];

let snow=data.daily.snowfall_sum[i];


let status="بدون بارش";


if(rain>0){

status="🌧 باران "+rain+" mm";

}


if(snow>0){

status="❄ برف "+snow+" cm";

}



html+=`

<div class="day">


<b class="gold">

${data.daily.time[i]}

</b>


<br>


🌡 دما:

${data.daily.temperature_2m_min[i]}

تا

${data.daily.temperature_2m_max[i]}

°C


<br>


💨 باد:

${data.daily.wind_speed_10m_max[i]}

km/h


<br>


${status}


<br>


☔ احتمال بارش:

${data.daily.precipitation_probability_max[i]}%




</div>


`;

}



document.getElementById("forecast").innerHTML=html;



}

catch(e){

document.getElementById("forecast").innerHTML=
"خطا در دریافت اطلاعات هواشناسی";

}


}




// دریافت شاخص آلودگی هوا

async function getAir(){


try{


let url=

`https://air-quality-api.open-meteo.com/v1/air-quality?
latitude=${lat}
&longitude=${lon}
&current=us_aqi
&timezone=Asia%2FTehran`;



url=url.replace(/\s/g,'');



let res=await fetch(url);

let data=await res.json();



let value=data.current.us_aqi;



let text="";



if(value<=50){

text="خوب";

}

else if(value<=100){

text="قابل قبول";

}

else{

text="ناسالم";

}



document.getElementById("aqi").innerHTML=

value+" - "+text;



}

catch(e){

document.getElementById("aqi").innerHTML=
"نامشخص";

}


}



getWeather();



</script>



<div class="footer">

اطلاعات هواشناسی به صورت آنلاین بروزرسانی می‌شود

</div>


</div>


</body>

  </html>
