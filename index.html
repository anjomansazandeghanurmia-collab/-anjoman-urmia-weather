<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<style>
body{margin:0;font-family:tahoma,Arial;background:#f4f6f8;color:#222}
.header{background:linear-gradient(135deg,#123b5d,#1d6b8f);color:white;padding:25px;text-align:center}
.header h1{font-size:22px;margin:0}
.container{max-width:1000px;margin:25px auto;padding:15px}
.card{background:white;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 8px 25px #0001}
.weather{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.item{background:#eef7fb;border-radius:15px;padding:18px;text-align:center}
.value{font-size:30px;font-weight:bold;color:#12658c}
.forecast{display:flex;gap:10px;overflow:auto}
.day{min-width:150px;background:#fafafa;border-radius:15px;padding:15px;text-align:center}
.small{color:#555}
</style>
</head>
<body>
<div class="header">
<h1>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</h1>
<p>سامانه آنلاین وضعیت هوا</p>
</div>

<div class="container">
<div class="card">
<h2>وضعیت فعلی ارومیه</h2>
<div class="weather">
<div class="item">🌡️ دما<div class="value" id="temp">--</div></div>
<div class="item">💧 رطوبت<div class="value" id="humidity">--</div></div>
<div class="item">💨 سرعت باد<div class="value" id="wind">--</div></div>
<div class="item">🌫️ آلودگی هوا<div class="value" id="air">قابل قبول</div></div>
</div>
</div>

<div class="card">
<h2>پیش‌بینی روزهای آینده</h2>
<div class="forecast" id="forecast"></div>
</div>
</div>

<script>
async function loadWeather(){
try{
let url="https://api.open-meteo.com/v1/forecast?latitude=37.5527&longitude=45.0761&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto";
let r=await fetch(url);
let d=await r.json();

document.getElementById("temp").innerHTML=d.current.temperature_2m+"°C";
document.getElementById("humidity").innerHTML=d.current.relative_humidity_2m+"%";
document.getElementById("wind").innerHTML=d.current.wind_speed_10m+" km/h";

let box=document.getElementById("forecast");
box.innerHTML="";
for(let i=0;i<7;i++){
box.innerHTML+=`
<div class="day">
<b>${d.daily.time[i]}</b>
<p>🌡️ ${d.daily.temperature_2m_min[i]} تا ${d.daily.temperature_2m_max[i]}°</p>
<p>💨 ${d.daily.wind_speed_10m_max[i]} km/h</p>
<p>🌧️ ${d.daily.precipitation_sum[i]} mm</p>
</div>`;
}
}catch(e){
document.getElementById("forecast").innerHTML="خطا در دریافت اطلاعات";
}
}
loadWeather();
setInterval(loadWeather,600000);
</script>
</body>
</html>
