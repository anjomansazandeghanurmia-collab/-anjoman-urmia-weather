<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;background:linear-gradient(160deg,#075985,#38bdf8);min-height:100vh}
.container{max-width:480px;width:94%;margin:auto;padding:20px 0}
.box{background:white;border-radius:30px;padding:22px;margin-bottom:18px;box-shadow:0 12px 30px #0003}
h1{text-align:center;font-size:20px;margin:0 0 10px}
.sub{text-align:center;color:#64748b}
.main{display:flex;justify-content:space-between;align-items:center}
.icon{font-size:75px}.temp{font-size:70px;font-weight:900}
.status{background:#e0f2fe;padding:8px 18px;border-radius:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.item{text-align:center}.item b{display:block;font-size:25px;margin:8px}
.air{text-align:center;padding:12px;border-radius:20px;background:#dcfce7;color:#15803d;font-weight:bold}
.day{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.day:last-child{border:0}
</style>
</head>
<body>
<div class="container">
<div class="box">
<h1>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</h1>
<div class="sub">هواشناسی آنلاین ارومیه</div>
</div>

<div class="box main">
<div class="icon" id="icon">🌤️</div>
<div style="text-align:center">
<div class="temp" id="temp">--°</div>
<div class="status" id="status">در حال دریافت...</div>
</div>
</div>

<div class="grid">
<div class="box item">💧<b id="humidity">--%</b>رطوبت</div>
<div class="box item">💨<b id="wind">--</b>سرعت باد</div>
<div class="box item">🌧️<b id="rain">--</b>بارش</div>
<div class="box item">🌡️<b id="feel">--</b>دما</div>
</div>

<div class="box">
<h3>شاخص آلودگی هوا</h3>
<div class="air" id="air">در حال دریافت...</div>
</div>

<div class="box">
<h3>پیش بینی ۷ روز آینده</h3>
<div id="forecast"></div>
</div>
</div>

<script>
const lat=37.5527, lon=45.0761;

fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTehran`)
.then(r=>r.json())
.then(d=>{
 document.getElementById("temp").innerHTML=Math.round(d.current.temperature_2m)+"°";
 document.getElementById("humidity").innerHTML=d.current.relative_humidity_2m+"%";
 document.getElementById("wind").innerHTML=d.current.wind_speed_10m+" km/h";
 document.getElementById("rain").innerHTML=d.current.precipitation+" mm";
 document.getElementById("feel").innerHTML=Math.round(d.current.temperature_2m)+"°";
 document.getElementById("status").innerHTML="اطلاعات زنده";
 let out="";
 let days=["امروز","شنبه","یکشنبه","دوشنبه","سه شنبه","چهارشنبه","پنجشنبه"];
 for(let i=0;i<7;i++){
  out+=`<div class="day"><span>${days[i]}</span><span>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°</span></div>`;
 }
 document.getElementById("forecast").innerHTML=out;
})
.catch(()=>document.getElementById("status").innerHTML="خطا در دریافت اطلاعات");

fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`)
.then(r=>r.json())
.then(d=>{
 let a=d.current.us_aqi;
 document.getElementById("air").innerHTML=a<=50?"🟢 قابل قبول AQI: "+a:"🟡 نیاز به توجه AQI: "+a;
});
</script>
</body>
</html>
