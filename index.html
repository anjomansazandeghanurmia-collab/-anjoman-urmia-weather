<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#f5f7fa;
color:#333;
}

.header{
text-align:center;
padding:25px;
font-size:22px;
color:#1b4f72;
font-weight:bold;
}

.weather{
width:90%;
max-width:700px;
margin:auto;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 5px 25px #ccc;
}

h2{
text-align:center;
color:#1b4f72;
}

.temp{
text-align:center;
font-size:60px;
font-weight:bold;
color:#e67e22;
}

.center{
text-align:center;
margin:15px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:#eef5fb;
padding:15px;
border-radius:15px;
text-align:center;
}

.day{
background:#f8f9fa;
margin-top:10px;
padding:12px;
border-radius:12px;
}

@media(max-width:600px){
.cards{
grid-template-columns:1fr;
}
}
</style>

</head>

<body>


<div class="header">
انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</div>


<div class="weather">

<h2>هواشناسی زنده ارومیه</h2>


<div class="temp" id="temp">
--°
</div>


<div class="center" id="status">
در حال دریافت اطلاعات...
</div>


<div class="cards">

<div class="card">
💧 رطوبت
<br>
<span id="humidity">--</span>٪
</div>


<div class="card">
🌬 سرعت باد
<br>
<span id="wind">--</span> km/h
</div>


<div class="card">
🌧 بارش
<br>
<span id="rain">--</span> mm
</div>


<div class="card">
🌫 آلودگی
<br>
قابل قبول
</div>


</div>


<h3>پیش‌بینی روزهای آینده</h3>

<div id="days"></div>


</div>



<script>

let lat=37.5527;
let lon=45.0761;


fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTehran`
)

.then(r=>r.json())

.then(data=>{


document.getElementById("temp").innerHTML=
Math.round(data.current.temperature_2m)+"°C";


document.getElementById("humidity").innerHTML=
data.current.relative_humidity_2m;


document.getElementById("wind").innerHTML=
data.current.wind_speed_10m;


document.getElementById("rain").innerHTML=
data.current.precipitation;


document.getElementById("status").innerHTML=
"آخرین بروزرسانی آنلاین ☀️";



let html="";


for(let i=0;i<7;i++){

html+=`

<div class="day">

روز ${i+1}

<br>

🌡 حداقل:
${data.daily.temperature_2m_min[i]}°

&nbsp;

حداکثر:
${data.daily.temperature_2m_max[i]}°

<br>

🌧 بارش:
${data.daily.precipitation_sum[i]} میلی‌متر

</div>

`;

}


document.getElementById("days").innerHTML=html;


})


.catch(()=>{

document.getElementById("status").innerHTML=
"خطا در دریافت اطلاعات";

});


</script>


</body>
</html>
