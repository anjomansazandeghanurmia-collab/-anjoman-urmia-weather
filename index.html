<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<style>
body{margin:0;background:#070707;color:#fff;font-family:tahoma;text-align:center}
.header{padding:15px;color:#d4af37;border-bottom:1px solid #d4af37}
.card{margin:20px auto;padding:20px;max-width:900px;background:#111;border:1px solid #d4af37;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.box{background:#1b1b1b;padding:15px;border-radius:15px}
.value{font-size:25px;color:#d4af37;margin-top:10px}
iframe{width:100%;height:400px;border:0;border-radius:15px}
</style>
</head>
<body>
<div class="header">انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</div>

<div class="card">
<h2>وضعیت آنلاین هوا - ارومیه</h2>
<div class="grid">
<div class="box">دما<div class="value" id="temp">--</div></div>
<div class="box">رطوبت<div class="value" id="hum">--</div></div>
<div class="box">باد<div class="value" id="wind">--</div></div>
<div class="box">کیفیت هوا<div class="value">قابل قبول</div></div>
</div>
</div>

<div class="card">
<h2>رادار ابری و بارش آنلاین</h2>
<iframe src="https://www.rainviewer.com/map.html?loc=37.55,45.07,7"></iframe>
</div>

<div class="card">
<h2>پیش بینی روزهای آینده</h2>
<div id="days">در حال دریافت اطلاعات...</div>
</div>

<script>
async function load(){
let url="https://api.open-meteo.com/v1/forecast?latitude=37.5527&longitude=45.0761&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,rain_sum,snowfall_sum,wind_speed_10m_max&timezone=Asia%2FTehran";
let d=await fetch(url).then(r=>r.json());
temp.innerHTML=d.current.temperature_2m+" °C";
hum.innerHTML=d.current.relative_humidity_2m+" %";
wind.innerHTML=d.current.wind_speed_10m+" km/h";
let x="";
for(let i=0;i<7;i++){
x+=`<p>${d.daily.time[i]} | دما ${d.daily.temperature_2m_min[i]} تا ${d.daily.temperature_2m_max[i]} | باد ${d.daily.wind_speed_10m_max[i]} km/h | احتمال بارش ${d.daily.precipitation_probability_max[i]}%</p>`;
}
days.innerHTML=x;
}
load();
</script>
</body>
</html>
