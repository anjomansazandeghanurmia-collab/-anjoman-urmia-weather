<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>

<style>
*{
box-sizing:border-box;
font-family:tahoma,Arial;
}

body{
margin:0;
background:#f3f5f7;
color:#222;
}

.header{
background:white;
padding:18px;
text-align:center;
box-shadow:0 2px 10px #ddd;
}

.header h1{
font-size:20px;
margin:0;
color:#174a7c;
}

.container{
max-width:1000px;
margin:25px auto;
padding:15px;
}

.weather-box{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 5px 20px #ddd;
}

.city{
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

.main-weather{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.temp{
font-size:55px;
font-weight:bold;
color:#174a7c;
}

.status{
font-size:18px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
margin-top:25px;
}

.card{
background:#f8fafc;
border-radius:15px;
padding:18px;
text-align:center;
border:1px solid #eee;
}

.card h3{
margin:5px;
font-size:16px;
color:#555;
}

.value{
font-size:25px;
font-weight:bold;
color:#174a7c;
}

.forecast{
margin-top:30px;
}

.forecast h2{
font-size:20px;
}

.days{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
gap:12px;
}

.day{
background:#fff;
padding:15px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 10px #ddd;
}

.loading{
text-align:center;
padding:30px;
color:#777;
}

.footer{
text-align:center;
padding:20px;
font-size:13px;
color:#777;
}

</style>
</head>


<body>

<div class="header">
<h1>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</h1>
</div>


<div class="container">

<div class="weather-box">

<div class="city">
🌤 هواشناسی زنده ارومیه
</div>


<div id="main" class="loading">
در حال دریافت اطلاعات هواشناسی...
</div>


<div class="cards">

<div class="card">
<h3>رطوبت</h3>
<div id="humidity" class="value">--</div>
</div>


<div class="card">
<h3>سرعت باد</h3>
<div id="wind" class="value">--</div>
</div>


<div class="card">
<h3>بارش</h3>
<div id="rain" class="value">--</div>
</div>


<div class="card">
<h3>شاخص آلودگی</h3>
<div class="value">قابل قبول</div>
</div>


</div>


<div class="forecast">

<h2>پیش‌بینی روزهای آینده</h2>

<div id="days" class="days">
</div>

</div>


</div>

</div>


<div class="footer">
سامانه هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</div>



<script>

const lat = 37.5527;
const lon = 45.0761;


async function weather(){

try{

let url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTehran`;


let res = await fetch(url);

let data = await res.json();



document.getElementById("main").innerHTML = `

<div class="main-weather">

<div>

<div class="temp">
${data.current.temperature_2m}°C
</div>

<div class="status">
وضعیت فعلی هوا در ارومیه
</div>

</div>

<div style="font-size:50px">
🌤
</div>

</div>

`;



document.getElementById("humidity").innerHTML =
data.current.relative_humidity_2m+"%";


document.getElementById("wind").innerHTML =
data.current.wind_speed_10m+" km/h";


document.getElementById("rain").innerHTML =
data.daily.precipitation_sum[0]+" mm";



let box="";


for(let i=0;i<5;i++){

box += `

<div class="day">

<b>
${data.daily.time[i]}
</b>

<p>
🌡 ${data.daily.temperature_2m_max[i]}°
</p>

<p>
💧 ${data.daily.precipitation_sum[i]} mm
</p>

</div>

`;

}


document.getElementById("days").innerHTML=box;



}catch(e){

document.getElementById("main").innerHTML=
"خطا در دریافت اطلاعات هواشناسی";

}

}


weather();


</script>

</body>
  </html>
