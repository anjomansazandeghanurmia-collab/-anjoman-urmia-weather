<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

font-family:tahoma,Arial,sans-serif;

background:
radial-gradient(circle at top,#252525,#050505 60%);

color:white;

min-height:100vh;

}


/* HEADER */

header{

background:
linear-gradient(135deg,#050505,#171717);

border-bottom:
1px solid #c9a227;

padding:18px;

box-shadow:
0 5px 30px #000;

}


.header{

max-width:1200px;

margin:auto;

display:flex;

justify-content:space-between;

align-items:center;

}


.logo{

color:#ffe58a;

font-size:14px;

font-weight:bold;

}


.live{

font-size:13px;

color:#ddd;

display:flex;

align-items:center;

gap:8px;

}


.dot{

width:10px;

height:10px;

border-radius:50%;

background:#22c55e;

box-shadow:
0 0 15px #22c55e;

}


/* MAIN */

main{

max-width:1200px;

margin:auto;

padding:25px 15px 50px;

}


/* BOX */

.box{

background:

linear-gradient(
145deg,
#191919,
#080808
);

border:

1px solid
rgba(212,175,55,.45);

border-radius:25px;

padding:25px;

margin-bottom:20px;

box-shadow:

0 15px 40px rgba(0,0,0,.7);

}


/* HERO */

.hero h1{

color:#ffe58a;

font-size:36px;

margin-bottom:10px;

}


.subtitle{

color:#aaa;

margin-bottom:25px;

}


.current{

display:flex;

align-items:center;

gap:20px;

}


.weather-icon{

font-size:75px;

}


.temperature{

font-size:80px;

font-weight:bold;

color:white;

}


.description{

font-size:20px;

color:#ffe58a;

}


/* UPDATE */

.update{

margin-top:20px;

color:#888;

font-size:13px;

}


/* AIR */

.air{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

}


.air-title{

color:#ffe58a;

font-size:22px;

}


.aqi{

font-size:40px;

font-weight:bold;

color:#ffe58a;

}


.air-status{

background:
linear-gradient(135deg,#8f6d16,#d4af37);

padding:12px 25px;

border-radius:30px;

font-weight:bold;

}


/* CARDS */


.cards{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:15px;

}


.card{

background:

linear-gradient(
145deg,
#161616,
#090909
);

border:

1px solid
rgba(212,175,55,.3);

border-radius:20px;

padding:22px;

text-align:center;

}


.card-icon{

font-size:35px;

margin-bottom:10px;

}


.label{

color:#999;

font-size:13px;

}


.value{

color:#ffe58a;

font-size:25px;

font-weight:bold;

margin-top:8px;

}


/* TITLE */

.title{

color:#ffe58a;

font-size:24px;

margin:30px 0 15px;

}


/* FORECAST */


.forecast{

display:grid;

grid-template-columns:
repeat(7,1fr);

gap:10px;

}


.day{

background:#111;

border:

1px solid rgba(212,175,55,.3);

border-radius:18px;

padding:15px 8px;

text-align:center;

}


.day-icon{

font-size:35px;

margin:10px;

}


.day-temp{

color:#ffe58a;

font-weight:bold;

}


/* RAIN */

.rain-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:15px;

}


.rain-card{

background:#111;

border:

1px solid rgba(212,175,55,.3);

border-radius:20px;

padding:20px;

}


.rain-value{

font-size:30px;

color:#ffe58a;

font-weight:bold;

}


/* FOOTER */

footer{

background:#050505;

border-top:
1px solid #c9a227;

text-align:center;

padding:30px;

color:#aaa;

}


footer strong{

color:#ffe58a;

}


/* MOBILE */


@media(max-width:900px){

.cards{

grid-template-columns:
repeat(2,1fr);

}


.forecast{

grid-template-columns:
repeat(4,1fr);

}

}



@media(max-width:600px){

.header{

flex-direction:column;

gap:10px;

align-items:flex-start;

}


.current{

gap:10px;

}


.temperature{

font-size:60px;

}


.weather-icon{

font-size:55px;

}


.cards{

grid-template-columns:
repeat(2,1fr);

}


.forecast{

display:flex;

overflow-x:auto;

}


.day{

min-width:130px;

}


.rain-grid{

grid-template-columns:1fr;

}


.air{

flex-direction:column;

align-items:flex-start;

}

}

</style>

  </head>
