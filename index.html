<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
font-family:tahoma,Arial;
color:white;
}

.header{
padding:12px;
text-align:center;
font-size:15px;
color:#d4af37;
border-bottom:1px solid #d4af37;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:#111;
border:1px solid #d4af37;
border-radius:18px;
padding:18px;
margin-bottom:18px;
}

h2{
color:#d4af37;
font-size:18px;
margin-top:0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
}

.box{
background:#1b1b1b;
padding:15px;
border-radius:12px;
text-align:center;
}

.number{
font-size:25px;
color:#d4af37;
margin-top:10px;
}

.forecast{
background:#171717;
padding:12px;
margin-top:10px;
border-radius:12px;
line-height:2;
}

.loading{
color:#d4af37;
text-align:center;
}

.error{
color:#ffcc00;
text-align:center;
}

</style>

</head>


<body>


<div class="header">
انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</div>


<div class="container">


<div class="card">

<h2>وضعیت فعلی هوا - ارومیه</h2>

<div class="grid">


<div class="box">
دمای هوا
<div class="number" id="temp">
--
</div>
</div>


<div class="box">
رطوبت
<div class="number" id="humidity">
--
</div>
</div>


<div class="box">
سرعت باد
<div class="number" id="wind">
--
</div>
</div>


<div class="box">
کیفیت هوا
<div class="number" id="air">
--
</div>
</div>


</div>

</div>



<div class="card">

<h2>
پیش بینی روزهای آینده
</h2>


<div id="forecast" class="loading">
در حال دریافت اطلاعات آنلاین...
</div>


</div>


</div>




<script>


const latitude = 37.5527;
const longitude = 45.0761;


async function weather(){


let api =
"https://api.open-meteo.com/v1/forecast?"
+
"latitude="+latitude+
"&longitude="+longitude+
"&current=temperature_2m,relative_humidity_2m,wind_speed_10m"
+
"&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,rain_sum,snowfall_sum,wind_speed_10m_max"
+
"&timezone=Asia%2FTehran";



try{


let response = await fetch(api);


if(!response.ok)
throw "خطا";


let data = await response.json();



document.getElementById("temp").innerHTML =
data.current.temperature_2m+"°C";


document.getElementById("humidity").innerHTML =
data.current.relative_humidity_2m+"%";


document.getElementById("wind").innerHTML =
data.current.wind_speed_10m+" km/h";


document.getElementById("air").innerHTML =
"قابل قبول";



let html="";


for(let i=0;i<7;i++){


let rain=data.daily.rain_sum[i];

let snow=data.daily.snowfall_sum[i];


let precipitation="ندارد";


if(rain>0)
precipitation="باران "+rain+" mm";


if(snow>0)
precipitation="برف "+snow+" cm";



html += `

<div class="forecast">

<b style="color:#d4af37">
${data.daily.time[i]}
</b>

<br>

🌡 دما:
${data.daily.temperature_2m_min[i]}
تا
${data.daily.temperature_2m_max[i]}
درجه

<br>

💨 باد:
${data.daily.wind_speed_10m_max[i]}
km/h

<br>

🌧 بارش:
${precipitation}

<br>

☔ احتمال بارش:
${data.daily.precipitation_probability_max[i]}%

</div>

`;

}



document.getElementById("forecast").innerHTML=html;


}

catch(error){


document.getElementById("forecast").innerHTML=

'<div class="error">عدم دریافت اطلاعات آنلاین - لطفاً اتصال اینترنت را بررسی کنید</div>';

}



}



weather();


</script>


</body>
  </html>
