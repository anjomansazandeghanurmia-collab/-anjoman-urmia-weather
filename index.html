<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:tahoma;
}

.title{
text-align:center;
padding:25px;
font-size:22px;
color:#d4af37;
}

.box{
max-width:700px;
margin:20px auto;
background:#1c1c1c;
border:1px solid #d4af37;
border-radius:20px;
padding:25px;
}

h2{
text-align:center;
color:#d4af37;
}

.temp{
text-align:center;
font-size:60px;
font-weight:bold;
}

.status{
text-align:center;
font-size:20px;
margin:15px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:#292929;
padding:15px;
border-radius:15px;
text-align:center;
}

.forecast{
margin-top:20px;
}

.day{
background:#242424;
padding:12px;
margin:8px 0;
border-radius:10px;
}

@media(max-width:600px){
.cards{
grid-template-columns:1fr;
}
}
</style>

</head>


<body>

<div class="title">
انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</div>


<div class="box">

<h2>هواشناسی زنده ارومیه</h2>

<div class="temp" id="temp">
--
</div>

<div class="status" id="condition">
در حال دریافت...
</div>


<div class="cards">

<div class="card">
💧 رطوبت
<br>
<span id="humidity">--</span> %
</div>


<div class="card">
🌬 باد
<br>
<span id="wind">--</span> km/h
</div>


<div class="card">
🌧 بارش
<br>
<span id="rain">--</span> mm
</div>


<div class="card">
🌫 آلودگی
<br>
قابل قبول
</div>

</div>


<div class="forecast" id="forecast">

</div>


</div>



<script>

const lat = 37.5527;
const lon = 45.0761;


fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`)
.then(res=>res.json())
.then(data=>{


document.getElementById("temp").innerHTML =
Math.round(data.current.temperature_2m)+"°C";


document.getElementById("humidity").innerHTML =
data.current.relative_humidity_2m;


document.getElementById("wind").innerHTML =
data.current.wind_speed_10m;


document.getElementById("rain").innerHTML =
data.current.precipitation;


document.getElementById("condition").innerHTML =
"اطلاعات آنلاین هواشناسی ☀️";



let html="";

for(let i=0;i<5;i++){

html+=`

<div class="day">

روز ${i+1}
<br>
🌡 ${data.daily.temperature_2m_min[i]}° تا ${data.daily.temperature_2m_max[i]}°
<br>
🌧 بارش: ${data.daily.precipitation_sum[i]} mm

</div>

`;

}

document.getElementById("forecast").innerHTML=html;


})

.catch(()=>{

document.getElementById("condition").innerHTML=
"خطا در دریافت اطلاعات";

});


</script>


</body>
  </html>
