<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>

<style>
body{
    margin:0;
    font-family:tahoma, Arial;
    background:#080808;
    color:#fff;
}

.header{
    text-align:center;
    padding:15px;
    font-size:16px;
    color:#d4af37;
    border-bottom:1px solid #d4af37;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#111;
    border:1px solid #d4af37;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 0 15px #000;
}

.title{
    color:#d4af37;
    font-size:20px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.item{
    background:#171717;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.value{
    font-size:25px;
    color:#d4af37;
    margin-top:8px;
}

.day{
    margin-top:10px;
    border-top:1px solid #333;
    padding-top:10px;
}

.loading{
    text-align:center;
    color:#d4af37;
}
</style>

</head>

<body>

<div class="header">
انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</div>


<div class="container">

<div class="card">
<div class="title">وضعیت فعلی ارومیه</div>

<div class="grid">

<div class="item">
دمای هوا
<div class="value" id="temp">--</div>
</div>

<div class="item">
رطوبت
<div class="value" id="humidity">--</div>
</div>


<div class="item">
سرعت باد
<div class="value" id="wind">--</div>
</div>


<div class="item">
شاخص آلودگی
<div class="value" id="air">--</div>
</div>

</div>
</div>



<div class="card">

<div class="title">
پیش بینی روزهای آینده
</div>

<div id="forecast" class="loading">
در حال دریافت اطلاعات...
</div>

</div>


</div>



<script>

const lat = 37.5527;
const lon = 45.0761;


async function loadWeather(){

let url =
`https://api.open-meteo.com/v1/forecast?
latitude=${lat}&longitude=${lon}
&current=temperature_2m,relative_humidity_2m,wind_speed_10m
&daily=temperature_2m_max,temperature_2m_min,
precipitation_probability_max,snowfall_sum,rain_sum,
wind_speed_10m_max
&timezone=Asia%2FTehran`;


url=url.replace(/\s+/g,'');


try{

let res = await fetch(url);
let data = await res.json();


document.getElementById("temp").innerHTML =
data.current.temperature_2m+" °C";


document.getElementById("humidity").innerHTML =
data.current.relative_humidity_2m+" %";


document.getElementById("wind").innerHTML =
data.current.wind_speed_10m+" km/h";


// نمایش ساده کیفیت هوا
document.getElementById("air").innerHTML =
"قابل قبول";



let html="";


for(let i=0;i<data.daily.time.length;i++){

let rain=data.daily.rain_sum[i];
let snow=data.daily.snowfall_sum[i];


let status="بدون بارش";

if(rain>0){
status="باران "+rain+" mm";
}

if(snow>0){
status="برف "+snow+" cm";
}



html+=`

<div class="day">

<b style="color:#d4af37">
${data.daily.time[i]}
</b>

<br><br>

🌡 دما:
${data.daily.temperature_2m_min[i]}
تا
${data.daily.temperature_2m_max[i]}
°C

<br>

💨 باد:
${data.daily.wind_speed_10m_max[i]}
km/h

<br>

🌧 بارش:
${status}

<br>

☔ احتمال بارش:
${data.daily.precipitation_probability_max[i]} %

</div>

`;

}


document.getElementById("forecast").innerHTML=html;


}

catch(e){

document.getElementById("forecast").innerHTML=
"خطا در دریافت اطلاعات هواشناسی";

}

}


loadWeather();

</script>


</body>
  </html>
