<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>

<style>
*{box-sizing:border-box;font-family:tahoma,Arial}
body{
    margin:0;
    background:#f4f6f8;
    color:#222;
}
header{
    text-align:center;
    padding:12px;
    font-size:15px;
    color:#555;
    background:white;
}
.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}
.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 20px #0001;
}
.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}
.big{
    font-size:45px;
    font-weight:bold;
    color:#1565c0;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
}
.box{
    background:#f7f9fb;
    border-radius:15px;
    padding:15px;
    text-align:center;
}
.box span{
    display:block;
    font-size:25px;
    margin-bottom:8px;
}
.forecast{
    display:flex;
    gap:10px;
    overflow-x:auto;
}
.day{
    min-width:130px;
    background:#f7f9fb;
    padding:15px;
    border-radius:15px;
    text-align:center;
}
.good{color:green;font-weight:bold}
.bad{color:red;font-weight:bold}
.loading{
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>
انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</header>

<div class="container">

<div class="card">
<div class="title">هواشناسی آنلاین ارومیه</div>
<div id="weather" class="loading">در حال دریافت اطلاعات...</div>
</div>


<div class="card">
<div class="title">کیفیت هوا</div>
<div id="air" class="loading">در حال دریافت شاخص آلودگی...</div>
</div>


<div class="card">
<div class="title">پیش‌بینی روزهای آینده</div>
<div id="forecast" class="forecast"></div>
</div>

</div>


<script>

const lat = 37.5527;
const lon = 45.0761;


function airText(aqi){
    if(aqi <= 50) return "قابل قبول";
    if(aqi <= 100) return "متوسط";
    if(aqi <= 150) return "ناسالم برای گروه‌های حساس";
    if(aqi <= 200) return "ناسالم";
    return "بسیار ناسالم";
}


// هواشناسی
fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=Asia%2FTehran`)
.then(r=>r.json())
.then(data=>{

let c=data.current;

document.getElementById("weather").innerHTML=`

<div class="big">${c.temperature_2m}°C</div>

<div class="grid">

<div class="box">
<span>💧</span>
رطوبت<br>${c.relative_humidity_2m}٪
</div>

<div class="box">
<span>💨</span>
باد<br>${c.wind_speed_10m} km/h
</div>

<div class="box">
<span>🌧</span>
بارش<br>${c.precipitation} mm
</div>

</div>
`;

let html="";

for(let i=0;i<7;i++){

html+=`

<div class="day">

<b>${data.daily.time[i]}</b>

<br><br>

🌡 ${data.daily.temperature_2m_max[i]}°

<br>
⬇ ${data.daily.temperature_2m_min[i]}°

<br><br>

🌧 ${data.daily.precipitation_sum[i]} mm

<br>

💨 ${data.daily.wind_speed_10m_max[i]} km/h

</div>

`;

}

document.getElementById("forecast").innerHTML=html;


})
.catch(()=>{
document.getElementById("weather").innerHTML="خطا در دریافت اطلاعات";
});



// کیفیت هوا

fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm10,pm2_5&timezone=Asia%2FTehran`)
.then(r=>r.json())
.then(data=>{

let a=data.current;

let cls=a.us_aqi<=100?"good":"bad";

document.getElementById("air").innerHTML=`

<div class="${cls}">
شاخص کیفیت هوا: ${a.us_aqi}
<br>
وضعیت: ${airText(a.us_aqi)}
</div>

<br>

PM2.5 : ${a.pm2_5} μg/m³

<br>

PM10 : ${a.pm10} μg/m³

`;

})
.catch(()=>{
document.getElementById("air").innerHTML="اطلاعات کیفیت هوا در دسترس نیست";
});

</script>

</body>
  </html>
