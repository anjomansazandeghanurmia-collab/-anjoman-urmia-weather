<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    font-family:"Vazirmatn",sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(160deg,#063b59,#1684b8);
    color:#172033;
}

.container{
    width:95%;
    max-width:480px;
    margin:auto;
    padding:18px 0 40px;
}


/* عنوان */

.header{
    background:rgba(255,255,255,.95);
    border-radius:35px;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 10px 30px #0002;
}

.header h1{
    font-size:22px;
    margin:0;
    font-weight:800;
}

.header p{
    color:#667085;
    margin-top:12px;
}



/* کارت اصلی */

.main-card{
    margin-top:35px;
    background:#fff;
    border-radius:35px;
    padding:35px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 15px 35px #0002;
}


.weather-icon{
    font-size:80px;
}


.temp{
    font-size:70px;
    font-weight:800;
    color:#111827;
}


.status{
    background:#f1f5f9;
    border-radius:30px;
    padding:10px 20px;
    color:#64748b;
    font-weight:600;
}



/* کارت های اطلاعات */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:25px;
}


.box{
    background:white;
    border-radius:30px;
    padding:25px 10px;
    text-align:center;
    box-shadow:0 10px 25px #0002;
}


.icon{
    width:65px;
    height:65px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    background:#e0f2fe;
}


.box h3{
    margin:15px 0 5px;
    color:#64748b;
    font-size:18px;
}


.value{
    font-size:25px;
    font-weight:800;
}



/* پیش بینی */

.forecast{
    margin-top:25px;
    background:white;
    border-radius:30px;
    padding:25px;
    box-shadow:0 10px 25px #0002;
}


.forecast h2{
    margin-top:0;
}


.day{
    display:flex;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid #eee;
}


.day:last-child{
    border:none;
}



@media(max-width:400px){

.temp{
    font-size:55px;
}

.weather-icon{
    font-size:60px;
}

.header h1{
    font-size:18px;
}

}

</style>

</head>


<body>

<div class="container">


<div class="header">

<h1>
انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</h1>

<p>
هواشناسی آنلاین ارومیه
</p>

</div>



<div class="main-card">

<div>
<div class="weather-icon">🌤️</div>
</div>


<div style="text-align:center">

<div class="temp">
18°
</div>

<div class="status">
کمی ابری
</div>

</div>

</div>




<div class="grid">


<div class="box">

<div class="icon">💧</div>

<h3>رطوبت</h3>

<div class="value">
47%
</div>

</div>



<div class="box">

<div class="icon">💨</div>

<h3>سرعت باد</h3>

<div class="value">
5 km/h
</div>

</div>



<div class="box">

<div class="icon">🌧️</div>

<h3>احتمال بارش</h3>

<div class="value">
10%
</div>

</div>



<div class="box">

<div class="icon">🌡️</div>

<h3>دمای واقعی</h3>

<div class="value">
18°
</div>

</div>



</div>



<div class="forecast">

<h2>
پیش بینی روزهای آینده ارومیه
</h2>


<div class="day">
<span>سه شنبه</span>
<span>☀️ 21°</span>
</div>


<div class="day">
<span>چهارشنبه</span>
<span>🌧️ 17°</span>
</div>


<div class="day">
<span>پنجشنبه</span>
<span>⛅ 19°</span>
</div>


</div>


</div>


</body>
  </html>
