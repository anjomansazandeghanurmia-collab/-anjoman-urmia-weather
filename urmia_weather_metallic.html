<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:tahoma;background:#050505;color:#fff}
header,footer{background:#080808;border-bottom:1px solid #d4af37;padding:18px;text-align:center}
.logo{color:#ffe58a;font-weight:bold;font-size:14px}
main{max-width:1100px;margin:auto;padding:20px}
.box{background:linear-gradient(145deg,#181818,#080808);border:1px solid #8f6d16;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 0 25px #000}
h1,h2{color:#ffe58a}
.big{font-size:70px;font-weight:bold;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#111;border:1px solid #6e5310;border-radius:18px;padding:20px;text-align:center}
.value{font-size:25px;color:#ffe58a;font-weight:bold}
.forecast{display:flex;gap:10px;overflow:auto}
.day{min-width:130px;background:#111;border:1px solid #6e5310;border-radius:15px;padding:15px;text-align:center}
button{display:none}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.big{font-size:55px}}
</style>
</head>
<body>
<header>
<div class="logo">🌤️ هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</div>
</header>

<main>
<div class="box">
<h1>هواشناسی ارومیه</h1>
<div id="icon">🌤️</div>
<div id="temp" class="big">--°</div>
<div id="desc">در حال دریافت اطلاعات...</div>
<p>آخرین بروزرسانی: <span id="update">--</span></p>
</div>

<div class="box">
<h2>🫁 کیفیت هوای آنلاین</h2>
<div id="aqi" class="value">--</div>
<div id="air">در حال بررسی...</div>
</div>

<div class="grid">
<div class="card">🌡️<br>احساس‌شده<br><span id="feel" class="value">--</span></div>
<div class="card">💧<br>رطوبت<br><span id="hum" class="value">--</span></div>
<div class="card">💨<br>باد<br><span id="wind" class="value">--</span></div>
<div class="card">🧭<br>جهت باد<br><span id="dir" class="value">--</span></div>
</div>

<div class="box">
<h2>📅 پیش‌بینی ۷ روزه</h2>
<div id="forecast" class="forecast"></div>
</div>
</main>

<footer>
هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه
</footer>

<script>
const LAT=37.5527,LON=45.0761;

function info(c){
const x={0:["☀️","صاف"],1:["🌤️","صاف"],2:["⛅","نیمه ابری"],3:["☁️","ابری"],61:["🌧️","باران"],71:["❄️","برف"],95:["⛈️","رعدوبرق"]};
return x[c]||["🌤️","نامشخص"];
}

async function load(){
const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTehran&forecast_days=7`;
const d=await fetch(u).then(r=>r.json());
let c=d.current,w=info(c.weather_code);
icon.innerText=w[0];temp.innerText=Math.round(c.temperature_2m)+"°";desc.innerText=w[1];
feel.innerText=Math.round(c.apparent_temperature)+"°";hum.innerText=c.relative_humidity_2m+"%";wind.innerText=Math.round(c.wind_speed_10m)+" km/h";
update.innerText=new Date().toLocaleTimeString("fa-IR");

forecast.innerHTML="";
d.daily.time.forEach((t,i)=>forecast.innerHTML+=`<div class="day">${t}<br>${info(d.daily.weather_code[i])[0]}<br>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°</div>`);
}

async function airLoad(){
const u=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=european_aqi&timezone=Asia%2FTehran`;
const d=await fetch(u).then(r=>r.json());
let a=d.current.european_aqi;
aqi.innerText=a;
air.innerText=a<=50?"خوب":a<=100?"متوسط":"ناسالم";
}

load();airLoad();
setInterval(()=>{load();airLoad()},600000);
</script>
</body>
</html>
