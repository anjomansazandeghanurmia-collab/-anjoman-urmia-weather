<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هواشناسی انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Vazirmatn,tahoma}
.header{text-align:center;padding:14px;color:#d4af37;font-size:15px;border-bottom:1px solid #5c4910}
.container{max-width:1000px;margin:auto;padding:15px}
.card{background:linear-gradient(145deg,#151515,#080808);border:1px solid #b8941f;border-radius:25px;padding:20px;margin:18px 0;box-shadow:0 0 25px #000}
h2{color:#d4af37;text-align:center;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.box{background:#202020;border-radius:18px;padding:20px;text-align:center;border:1px solid #333}
.icon{font-size:30px}
.value{font-size:27px;color:#d4af37;margin-top:8px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.day{background:#1b1b1b;border-radius:15px;padding:15px;border:1px solid #333;line-height:2}
.gold{color:#d4af37}
button{background:#d4af37;border:0;padding:10px 25px;border-radius:20px;font-weight:bold;cursor:pointer}
iframe{width:100%;height:420px;border:0;border-radius:20px}
.small{text-align:center;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="header">انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</div>
<div class="container">

<div class="card">
<h2>🌤 وضعیت فعلی هوا - ارومیه</h2>
<div class="grid">
<div class="box">🌡 دما<div class="value" id="temp">--</div></div>
<div class="box">💧 رطوبت<div class="value" id="hum">--</div></div>
<div class="box">💨 باد<div class="value" id="wind">--</div></div>
<div class="box">🌫 کیفیت هوا<div class="value">قابل قبول</div></div>
</div>
<br>
<div class="small" id="update">آخرین بروزرسانی: --</div>
</div>

<div class="card">
<h2>📅 پیش بینی ۷ روز آینده</h2>
<div class="days" id="days">در حال دریافت...</div>
</div>

<div class="card">
<h2>☁️ رادار ابری و بارش آنلاین</h2>
<iframe src="https://www.rainviewer.com/map.html?loc=37.55,45.07,7"></iframe>
</div>

</div>

<script>
async function loadWeather(){
const url="https://api.open-meteo.com/v1/forecast?latitude=37.5527&longitude=45.0761&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,rain_sum,snowfall_sum,wind_speed_10m_max&timezone=Asia%2FTehran";
try{
const d=await fetch(url).then(r=>r.json());
document.getElementById('temp').innerHTML=d.current.temperature_2m+"°C";
document.getElementById('hum').innerHTML=d.current.relative_humidity_2m+"%";
document.getElementById('wind').innerHTML=d.current.wind_speed_10m+" km/h";
document.getElementById('update').innerHTML="آخرین بروزرسانی: "+new Date().toLocaleTimeString('fa-IR');
let out="";
for(let i=0;i<7;i++){
let p="بدون بارش";
if(d.daily.rain_sum[i]>0)p="باران "+d.daily.rain_sum[i]+"mm";
if(d.daily.snowfall_sum[i]>0)p="برف "+d.daily.snowfall_sum[i]+"cm";
out+=`<div class="day"><b class="gold">${d.daily.time[i]}</b><br>🌡 ${d.daily.temperature_2m_min[i]} تا ${d.daily.temperature_2m_max[i]}°C<br>💨 ${d.daily.wind_speed_10m_max[i]} km/h<br>🌧 ${p}<br>☔ ${d.daily.precipitation_probability_max[i]}%</div>`;
}
document.getElementById('days').innerHTML=out;
}catch(e){document.getElementById('days').innerHTML="خطا در دریافت اطلاعات";}
}
loadWeather();
</script>
</body>
</html>
